name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Jackson-richard
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00E5FF&color_dots=#0d1117,#001f2d,#003a52,#005f85,#00E5FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=00E5FF&color_dots=#0d1117,#001f2d,#003a52,#005f85,#00E5FF

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
